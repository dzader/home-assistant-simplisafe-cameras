views:
  - title: On demand
    path: cameras
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: picture-entity
            entity: camera.example_legacy_a
            name: Legacy camera A
            camera_view: auto
            aspect_ratio: '16:9'
            show_state: false
            show_name: true
            tap_action:
              action: more-info
            grid_options:
              columns: 12
              rows: auto
          - type: picture-entity
            entity: camera.example_legacy_b
            name: Legacy camera B
            camera_view: auto
            aspect_ratio: '16:9'
